<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Tournaments Portal</title>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">Tech Tournaments</div>
      <nav class="nav">
        <button class="nav-tab active" data-tab="fixtures">Fixtures</button>
        <button class="nav-tab" data-tab="results">Results</button>
        <button class="nav-tab" data-tab="media">Photos & Videos</button>
      </nav>
      <a href="admin.html" class="admin-link">Admin</a>
    </div>
  </header>

  <main class="section">
    <div class="container">

      <!-- Fixtures -->
      <section id="tab-fixtures" class="tab-section active">
        <h2>Fixtures</h2>
        <p class="tab-desc">Upcoming matches and schedules.</p>
        <div id="fixturesContainer" class="cards"></div>
      </section>

      <!-- Results -->
      <section id="tab-results" class="tab-section">
        <h2>Results</h2>
        <p class="tab-desc">Completed matches and scores.</p>
        <div id="resultsContainer" class="cards"></div>
      </section>

      <!-- Media -->
      <section id="tab-media" class="tab-section">
        <h2>Photos & Videos</h2>
        <p class="tab-desc">Tournament highlights and media gallery.</p>
        <div id="mediaContainer" class="media-grid"></div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Tech Tournaments Portal</p>
    </div>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="assets/js/main.js"></script>
</body>
</html>
